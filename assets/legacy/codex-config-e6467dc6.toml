sub_llm_cmd = "codex exec --ephemeral --skip-git-repo-check --ignore-user-config --ignore-rules --sandbox read-only {isolated_env} -c model_reasoning_effort=low -c skills.include_instructions=false -c features.shell_tool=false -c features.view_image=false -c features.multi_agent=false -c features.multi_agent_v2=false -c agents.enabled=false -c web_search=disabled --json --model {model} -C {sandbox_dir} -"
default_model = "gpt-5.6-luna"
output_cap = 8192
max_depth = 1
sub_timeout = 300
max_sessions = 4
cell_timeout = 60
idle_timeout = 1800
clean_patterns = []
jcode_provider = "openai"
jcode_reasoning = "low"
max_calls_per_cell = 64
