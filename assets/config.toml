# Provider boundary. "jcode-api" uses the stable daemon bridge and subscription OAuth.
# Any other value is parsed as an argv command template and receives the prompt on stdin.
sub_llm_cmd = "jcode-api"
default_model = "gpt-5.6-luna"
jcode_provider = "openai"        # ChatGPT subscription, never openai-api
jcode_reasoning = "low"
output_cap = 8192
max_depth = 1
sub_timeout = 300
max_sessions = 4
cell_timeout = 60
idle_timeout = 1800
max_calls_per_cell = 64
clean_patterns = []
