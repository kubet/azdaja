# Provider boundary. "jcode-api" uses the stable daemon bridge and subscription OAuth.
# Any other value is parsed as an argv command template and receives the prompt on stdin.
sub_llm_cmd = "jcode-api"
default_model = "gpt-5.6-sol"
jcode_provider = "openai"        # ChatGPT subscription, never openai-api
jcode_reasoning = "low"
output_cap = 8192
max_depth = 1
sub_timeout = 300
max_sessions = 4
cell_timeout = 60
idle_timeout = 1800
max_calls_per_cell = 150
clean_patterns = []

# Optional native typed judgments in exec and solo. Official release builds
# include the transport; source builds use `cargo build --features typesafe`.
# A valid configured environment key or attachment enables automatic exec/batch mode.
# No key means off. Set enabled = false to force off even with a key.
# Set enabled = true for explicit mode. Never put the API key in this file.
# Autonomous solo requires explicit true and remains experimental, not auto-enabled.
# Only explicit state/questions passed to judge_many leave the evaluator.
[judge]
# enabled = false
model = "jev-latest"
key_env = "TYPESAFE_API_KEY"
timeout_secs = 20
max_requests_per_cell = 8
max_questions_per_cell = 128
max_request_bytes = 131072
max_response_bytes = 262144
max_input_tokens_per_cell = 100000
