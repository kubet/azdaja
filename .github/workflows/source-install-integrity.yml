name: Current source and install integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-source-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-install:
    name: current source/install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install checked-out source and exercise the local HTTP installer
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          server_pid=
          cleanup() {
            if [ -n "${server_pid:-}" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          cargo build --release --locked
          AZDAJA_PRODUCT_BINARY=target/release/azdaja \
            cargo test --release --locked --test product_50mb \
            offline_scripted_harness_answers_three_real_world_50_mib_files_without_a_death \
            -- --ignored --exact --test-threads=1

          source_root="$scratch/source-root"
          source_home="$scratch/source-home"
          install_home="$scratch/install-home"
          install_bin="$install_home/bin"
          guard="$scratch/provider-guard"
          marker="$scratch/provider-called"
          fixture="$scratch/release"
          mkdir -p "$source_home" "$install_home" "$guard" "$fixture"
          for tool in jcode claude codex gemini opencode; do
            cat > "$guard/$tool" <<EOF
          #!/bin/sh
          printf called > "$marker"
          exit 93
          EOF
            chmod 755 "$guard/$tool"
          done

          CARGO_TARGET_DIR="$scratch/cargo-target" \
            cargo install --path . --locked --root "$source_root"
          source_binary="$source_root/bin/azdaja"
          test -x "$source_binary"
          test "$("$source_binary" --version)" = "azdaja 0.1.10 (monty 0.0.21)"
          HOME="$source_home" PATH="$guard:$PATH" \
            "$source_binary" doctor --caps > "$scratch/source-caps.json"
          python3 - "$scratch/source-caps.json" <<'PY'
          import json
          import pathlib
          import sys

          caps = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert caps["azdaja"] == "0.1.10", caps
          assert caps["monty"] == "0.0.21", caps
          assert caps["dump_version"] == 5, caps
          assert "persistent-repl" in caps["capabilities"], caps
          assert "monty-os-calls-denied" in caps["capabilities"], caps
          PY
          test ! -e "$marker"
          test -z "$(find "$source_home" -mindepth 1 -print -quit)"

          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset=azdaja-v0.1.10-darwin-arm64 ;;
            Linux-x86_64) asset=azdaja-v0.1.10-linux-x86_64 ;;
            *) printf 'unsupported CI host: %s-%s\n' "$(uname -s)" "$(uname -m)" >&2; exit 1 ;;
          esac
          cp "$source_binary" "$fixture/azdaja-v0.1.10-darwin-arm64"
          cp "$source_binary" "$fixture/azdaja-v0.1.10-linux-x86_64"
          cp LICENSE THIRD-PARTY-NOTICES.md "$fixture/"
          digest="$(python3 - "$source_binary" <<'PY'
          import hashlib
          import pathlib
          import sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          python3 - "$fixture" "$digest" <<'PY'
          import hashlib
          import pathlib
          import sys
          fixture, binary_digest = pathlib.Path(sys.argv[1]), sys.argv[2]
          payloads = [
              ("azdaja-v0.1.10-darwin-arm64", binary_digest),
              ("azdaja-v0.1.10-linux-x86_64", binary_digest),
              ("LICENSE", hashlib.sha256((fixture / "LICENSE").read_bytes()).hexdigest()),
              ("THIRD-PARTY-NOTICES.md", hashlib.sha256((fixture / "THIRD-PARTY-NOTICES.md").read_bytes()).hexdigest()),
          ]
          (fixture / "SHA256SUMS").write_text("".join(f"{digest}  {name}\n" for name, digest in payloads))
          PY

          cat > "$scratch/serve.py" <<'PY'
          import functools
          import http.server
          import pathlib
          import sys

          root, port_file = sys.argv[1:]
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=root)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), handler)
          pathlib.Path(port_file).write_text(str(server.server_port))
          server.serve_forever()
          PY
          port_file="$scratch/port"
          python3 "$scratch/serve.py" "$fixture" "$port_file" > "$scratch/server.log" 2>&1 &
          server_pid=$!
          for _ in {1..100}; do
            [ -s "$port_file" ] && break
            kill -0 "$server_pid" 2>/dev/null || { cat "$scratch/server.log" >&2; exit 1; }
            sleep 0.1
          done
          test -s "$port_file"
          base="http://127.0.0.1:$(cat "$port_file")"

          # This is the only download surface: a loopback fixture made from the
          # checked-out source install. No release asset is requested.
          # Keep a bounded system PATH. Hosted images may still expose Azure CLI as `az`;
          # the installer must preserve it and omit its optional alias in that case.
          HOME="$install_home" PATH="$guard:/usr/bin:/bin:/usr/sbin:/sbin" \
            AZDAJA_INSTALL_TEST_MODE=local AZDAJA_INSTALL_GLIBC_VERSION=2.35 \
            AZDAJA_INSTALL_BASE_URL="$base" \
            sh site/install jcode,claude --bin-dir "$install_bin"
          installed="$install_bin/azdaja"
          alias="$install_bin/az"
          cmp "$source_binary" "$installed"
          alias_installed=false
          if [ -L "$alias" ]; then
            test "$(readlink "$alias")" = azdaja
            alias_installed=true
          else
            test ! -e "$alias"
            PATH="$guard:/usr/bin:/bin:/usr/sbin:/sbin" command -v az >/dev/null
          fi
          cmp LICENSE "$install_home/.local/share/azdaja/LICENSE"
          cmp THIRD-PARTY-NOTICES.md "$install_home/.local/share/azdaja/THIRD-PARTY-NOTICES.md"

          jcode_binary="$install_home/.jcode/skills/azdaja/azdaja"
          jcode_config="$install_home/.jcode/config.toml"
          test -x "$jcode_binary"
          cmp "$source_binary" "$jcode_binary"
          grep -F '# >>> azdaja managed Jcode hooks >>>' "$jcode_config"
          grep -F 'pre_tool = ' "$jcode_config"
          grep -F 'jcode-hook' "$jcode_config"
          ! grep -F 'turn_end = ' "$jcode_config"
          ! grep -F 'session_end = ' "$jcode_config"
          HOME="$install_home" PATH="$guard:$PATH" \
            "$installed" doctor jcode > "$scratch/jcode-doctor"
          grep -F 'PASS jcode: managed skill is installed and memory handoff is configured' \
            "$scratch/jcode-doctor"

          repo="$scratch/handoff-repo"
          mkdir -p "$repo/src"
          printf 'pub fn answer() -> u32 { 42 }\n' > "$repo/src/lib.rs"
          printf '# local installer handoff\n' > "$repo/README.md"
          set +e
          (
            cd "$repo"
            printf '%s' '{"file_path":"src/lib.rs","start_line":1,"limit":5000}' | \
              HOME="$install_home" AZDAJA_HOME="$scratch/handoff-state" \
              JCODE_HOOK_EVENT=pre_tool JCODE_HOOK_SESSION_ID=source-install-ci \
              JCODE_HOOK_CWD="$repo" JCODE_HOOK_TOOL_NAME=read \
              "$jcode_binary" jcode-hook > "$scratch/handoff-blocked.stdout" \
              2> "$scratch/handoff-blocked.stderr"
          )
          blocked_status=$?
          set -e
          test "$blocked_status" -eq 2
          test ! -s "$scratch/handoff-blocked.stdout"
          grep -F 'Azdaja should carry this broad read.' "$scratch/handoff-blocked.stderr"
          grep -F 'Replace <user task> with the current user request' "$scratch/handoff-blocked.stderr"
          grep -F -- '--repo .' "$scratch/handoff-blocked.stderr"
          challenge="$(sed -n 's/.*AZDAJA_JCODE_CHALLENGE=\([0-9a-f]\{32\}\).*/\1/p' "$scratch/handoff-blocked.stderr" | head -n 1)"
          test "${#challenge}" -eq 32

          provider="$scratch/handoff-provider.py"
          provider_calls="$scratch/handoff-provider-calls"
          cat > "$provider" <<'PY'
          import os
          import sys

          assert "AZDAJA_JCODE_CHALLENGE" not in os.environ
          open(sys.argv[1], "a").write("call\n")
          sys.stdin.read()
          print('```python\nFINAL("source-install-memory-ok")\n```')
          PY
          provider_python="$(command -v python3)"
          cat > "$scratch/handoff-config.toml" <<EOF
          sub_llm_cmd = "$provider_python $provider $provider_calls"
          default_model = "mock"
          output_cap = 4096
          max_depth = 1
          sub_timeout = 10
          max_sessions = 4
          cell_timeout = 2
          idle_timeout = 1800
          clean_patterns = []
          jcode_provider = "openai"
          jcode_reasoning = "medium"
          max_calls_per_cell = 64
          EOF
          (
            cd "$repo"
            HOME="$install_home" AZDAJA_HOME="$scratch/handoff-state" \
              AZDAJA_CONFIG="$scratch/handoff-config.toml" \
              AZDAJA_JCODE_CHALLENGE="$challenge" \
              "$jcode_binary" solo 'summarize the repository implementation' \
              --repo . > "$scratch/handoff-answer"
          )
          test "$(cat "$scratch/handoff-answer")" = source-install-memory-ok
          test "$(cat "$provider_calls")" = call

          set +e
          (
            cd "$repo"
            printf '%s' '{"file_path":"src/lib.rs","start_line":1,"limit":5000}' | \
              HOME="$install_home" AZDAJA_HOME="$scratch/handoff-state" \
              JCODE_HOOK_EVENT=pre_tool JCODE_HOOK_SESSION_ID=source-install-ci \
              JCODE_HOOK_CWD="$repo" JCODE_HOOK_TOOL_NAME=read \
              "$jcode_binary" jcode-hook > /dev/null 2> "$scratch/handoff-still-blocked"
          )
          blocked_status=$?
          set -e
          test "$blocked_status" -eq 2
          grep -F 'Do not retry the blocked broad read.' "$scratch/handoff-still-blocked"
          second_challenge="$(sed -n 's/.*AZDAJA_JCODE_CHALLENGE=\([0-9a-f]\{32\}\).*/\1/p' "$scratch/handoff-still-blocked" | head -n 1)"
          test "${#second_challenge}" -eq 32

          printf 'tiny\n' > "$repo/tiny.txt"
          set +e
          (
            cd "$repo"
            HOME="$install_home" AZDAJA_HOME="$scratch/handoff-state" \
              AZDAJA_CONFIG="$scratch/handoff-config.toml" \
              AZDAJA_JCODE_CHALLENGE="$second_challenge" \
              "$jcode_binary" solo 'read the tiny file' -f tiny.txt \
              > "$scratch/handoff-file.stdout" 2> "$scratch/handoff-file.stderr"
          )
          file_status=$?
          set -e
          test "$file_status" -ne 0
          test ! -s "$scratch/handoff-file.stdout"
          grep -F 'file-scoped Azdaja work' "$scratch/handoff-file.stderr"
          test "$(cat "$provider_calls")" = call
          (
            cd "$repo"
            printf '%s' '{"file_path":"src/lib.rs","start_line":1,"limit":64}' | \
              HOME="$install_home" AZDAJA_HOME="$scratch/handoff-state" \
              JCODE_HOOK_EVENT=pre_tool JCODE_HOOK_SESSION_ID=source-install-ci \
              JCODE_HOOK_CWD="$repo" JCODE_HOOK_TOOL_NAME=read \
              "$jcode_binary" jcode-hook
          )

          cat > "$scratch/expected-help" <<'EOF'
          AZDAJA v0.1.10 — virtual memory for language models
          Usage: az <command>
          Commands: help solo map install doctor start load exec final list kill uninstall memory
          Install: az install  (auto-detects supported tools)
          Example: az solo "summarize this file" -f ./document.txt
          EOF
          HOME="$install_home" PATH="$guard:$PATH" "$installed" > "$scratch/help-canonical"
          HOME="$install_home" PATH="$guard:$PATH" NO_COLOR=1 TERM=xterm-256color \
            "$installed" > "$scratch/help-no-color-canonical"
          if [ "$alias_installed" = true ]; then
            HOME="$install_home" PATH="$guard:$PATH" "$alias" > "$scratch/help-alias"
            HOME="$install_home" PATH="$guard:$PATH" NO_COLOR=1 TERM=xterm-256color \
              "$alias" > "$scratch/help-no-color-alias"
          fi
          for output in "$scratch"/help-*; do
            cmp "$scratch/expected-help" "$output"
          done
          HOME="$install_home" PATH="$guard:$PATH" \
            "$installed" doctor --caps > "$scratch/installed-caps.json"
          cmp "$scratch/source-caps.json" "$scratch/installed-caps.json"
          test ! -e "$marker"

          HOME="$install_home" PATH="$guard:$PATH" \
            "$installed" uninstall jcode > "$scratch/jcode-uninstall"
          test ! -e "$install_home/.jcode/skills/azdaja"
          test ! -e "$jcode_config"
