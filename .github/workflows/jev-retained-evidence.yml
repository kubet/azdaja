name: Verify retained Jev evidence

on:
  push:
    branches: [main]
    paths:
      - "bench/jev/**"
      - "bench/oolong/**"
      - ".github/workflows/jev-retained-evidence.yml"
  pull_request:
    paths:
      - "bench/jev/**"
      - "bench/oolong/**"
      - ".github/workflows/jev-retained-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-jev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JCODE_SCRATCH_DIR: ${{ runner.temp }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Estimator and portable evidence boundary tests
        run: >-
          python3 -B -m unittest
          bench.jev.audit_sampling.test_estimator
          bench.jev.audit_sampling.test_replay
          bench.jev.audit_sampling.test_portable -v
      - name: Replay all 6000 fixed audits without the author's binary or paths
        run: >-
          python3 -B -m bench.jev.audit_sampling.replay
          --output "$RUNNER_TEMP/jev-portable-replay.json"
      - name: Retain the explicitly scoped offline result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-portable-evidence
          path: ${{ runner.temp }}/jev-portable-replay.json
          if-no-files-found: error
          retention-days: 30
