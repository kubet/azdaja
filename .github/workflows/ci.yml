name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify exact Cargo package allowlist
        shell: bash
        run: |
          set -euo pipefail
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          cargo package --list --allow-dirty --locked > "$listing"
          python3 - "$listing" <<'PY'
          import pathlib
          import sys

          actual = pathlib.Path(sys.argv[1]).read_text().splitlines()
          expected = [
              ".cargo_vcs_info.json",
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE",
              "README.md",
              "THIRD-PARTY-NOTICES.md",
              "assets/template/SKILL.md",
              "assets/config.toml",
              "assets/legacy/codex-config-41f19430.toml",
              "assets/legacy/codex-config-a9da6615.toml",
              "assets/legacy/codex-config-ae85a189.toml",
              "assets/legacy/codex-config-e6467dc6.toml",
              "assets/legacy/jcode-config-bc956890.toml",
              "assets/legacy/jcode-config-d890a0fa.toml",
              "assets/legacy/opencode-config-f077082c.toml",
              "src/banner.rs",
              "src/dashboard.rs",
              "src/jcode_config.rs",
              "src/jcode_gate.rs",
              "src/lib.rs",
              "src/main.rs",
              "src/memory.rs",
              "src/observability.rs",
              "src/repo_source.rs",
              "src/tui.rs",
          ]
          assert actual == expected, {"actual": actual, "expected": expected}
          forbidden = (
              "bench/", "evidence/", "docs/evidence/",
              "history/", "docs/history/", "release/",
          )
          assert not any(path.startswith(forbidden) for path in actual), actual
          PY
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all --locked -- --test-threads=1
      - run: cargo build --release --locked
      - name: Verify advertised Linux glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          target/release/azdaja --version
      - name: Release-only 50 MiB product acceptance
        run: >-
          AZDAJA_PRODUCT_BINARY=target/release/azdaja
          cargo test --release --locked --test product_50mb
          offline_scripted_harness_answers_three_real_world_50_mib_files_without_a_death
          -- --ignored --exact --test-threads=1
      - run: target/release/azdaja --version
      - run: target/release/azdaja doctor --caps
      - if: runner.os == 'Linux'
        run: python3 bench/perf.py --binary target/release/azdaja --sizes-mb 1 --repeats 3

      # Manual runs validate and retain exact candidate bytes for later platform validation.
      # These artifacts are not releases and may not be bound into site/install.
      - name: Validate release candidate install, plain help, and 50 MiB path
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/target/release/azdaja"
          digest="$(python3 - "$candidate" <<'PY'
          import hashlib
          import pathlib
          import sys
          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )"
          scratch="$(mktemp -d)"
          server_pid=
          cleanup() {
            if [ -n "${server_pid:-}" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT

          fixture="$scratch/release"
          home="$scratch/home"
          bin="$home/bin"
          guard="$scratch/provider-guard"
          marker="$scratch/provider-called"
          mkdir -p "$fixture" "$home" "$guard"
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64|Darwin-x86_64|Linux-x86_64) ;;
            *) printf 'unsupported CI host: %s-%s\n' "$(uname -s)" "$(uname -m)" >&2; exit 1 ;;
          esac
          cp "$candidate" "$fixture/azdaja-v0.1.13-darwin-arm64"
          cp "$candidate" "$fixture/azdaja-v0.1.13-darwin-x86_64"
          cp "$candidate" "$fixture/azdaja-v0.1.13-linux-x86_64"
          cp LICENSE THIRD-PARTY-NOTICES.md "$fixture/"
          python3 - "$fixture" "$digest" <<'PY'
          import hashlib
          import pathlib
          import sys
          fixture, binary_digest = pathlib.Path(sys.argv[1]), sys.argv[2]
          payloads = [
              ("azdaja-v0.1.13-darwin-arm64", binary_digest),
              ("azdaja-v0.1.13-darwin-x86_64", binary_digest),
              ("azdaja-v0.1.13-linux-x86_64", binary_digest),
              ("LICENSE", hashlib.sha256((fixture / "LICENSE").read_bytes()).hexdigest()),
              ("THIRD-PARTY-NOTICES.md", hashlib.sha256((fixture / "THIRD-PARTY-NOTICES.md").read_bytes()).hexdigest()),
          ]
          (fixture / "SHA256SUMS").write_text("".join(f"{digest}  {name}\n" for name, digest in payloads))
          PY
          for tool in jcode claude codex gemini opencode; do
            cat > "$guard/$tool" <<EOF
          #!/bin/sh
          printf called > "$marker"
          exit 93
          EOF
            chmod 755 "$guard/$tool"
          done

          cat > "$scratch/serve.py" <<'PY'
          import functools
          import http.server
          import pathlib
          import sys

          root, port_file = sys.argv[1:]
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=root)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), handler)
          pathlib.Path(port_file).write_text(str(server.server_port))
          server.serve_forever()
          PY
          port_file="$scratch/port"
          python3 "$scratch/serve.py" "$fixture" "$port_file" > "$scratch/server.log" 2>&1 &
          server_pid=$!
          for _ in {1..100}; do
            [ -s "$port_file" ] && break
            kill -0 "$server_pid" 2>/dev/null || { cat "$scratch/server.log" >&2; exit 1; }
            sleep 0.1
          done
          test -s "$port_file"
          base="http://127.0.0.1:$(cat "$port_file")"

          # Keep a bounded system PATH. Hosted images may still expose Azure CLI as `az`;
          # the installer must preserve it and omit its optional alias in that case.
          HOME="$home" PATH="$guard:/usr/bin:/bin:/usr/sbin:/sbin" \
            AZDAJA_INSTALL_TEST_MODE=local AZDAJA_INSTALL_GLIBC_VERSION=2.35 \
            AZDAJA_INSTALL_BASE_URL="$base" \
            sh site/install claude --bin-dir "$bin"
          installed="$home/.claude/skills/azdaja/azdaja"
          cmp "$candidate" "$installed"
          alias="$bin/az"
          alias_installed=false
          if [ -L "$alias" ]; then
            test "$(readlink "$alias")" = azdaja
            alias_installed=true
          else
            test ! -e "$alias"
            PATH="$guard:/usr/bin:/bin:/usr/sbin:/sbin" command -v az >/dev/null
          fi
          cmp LICENSE "$home/.local/share/azdaja/LICENSE"
          cmp THIRD-PARTY-NOTICES.md "$home/.local/share/azdaja/THIRD-PARTY-NOTICES.md"

          cat > "$scratch/expected-help" <<'EOF'
          AZDAJA v0.1.13 — virtual memory for language models
          Usage: az <command>
          Commands: help solo map install doctor start load exec final list kill uninstall memory
          Install: az install  (auto-detects supported tools)
          Example: az solo "summarize this file" -f ./document.txt
          EOF
          HOME="$home" PATH="$guard:$PATH" "$bin/azdaja" > "$scratch/help-canonical"
          HOME="$home" PATH="$guard:$PATH" NO_COLOR=1 TERM=xterm-256color \
            "$bin/azdaja" > "$scratch/help-no-color-canonical"
          if [ "$alias_installed" = true ]; then
            HOME="$home" PATH="$guard:$PATH" "$alias" > "$scratch/help-alias"
            HOME="$home" PATH="$guard:$PATH" NO_COLOR=1 TERM=xterm-256color \
              "$alias" > "$scratch/help-no-color-alias"
          fi
          for output in "$scratch"/help-*; do
            cmp "$scratch/expected-help" "$output"
          done
          test ! -e "$marker"

          AZDAJA_PRODUCT_BINARY=target/release/azdaja \
            cargo test --release --locked --test product_50mb \
            offline_scripted_harness_answers_three_real_world_50_mib_files_without_a_death \
            -- --ignored --exact --test-threads=1
          test ! -e "$marker"
          printf '\n# candidate-receipt-custom\n' >> \
            "$home/.claude/skills/azdaja/config.toml"
          # Exclude any hosted-runner Azure CLI so the optional `az` alias is deterministic.
          HOME="$home" PATH="$guard:/usr/bin:/bin:/usr/sbin:/sbin" \
            AZDAJA_INSTALL_TEST_MODE=local AZDAJA_INSTALL_GLIBC_VERSION=2.35 \
            AZDAJA_INSTALL_BASE_URL="$base" \
            sh site/install claude --bin-dir "$bin"
          grep -F '# candidate-receipt-custom' \
            "$home/.claude/skills/azdaja/config.toml"
          test ! -e "$marker"
          HOME="$home" PATH="$guard:$PATH" "$installed" uninstall claude
          test ! -e "$home/.claude/skills/azdaja"

      - name: Package unvalidated candidate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AZDAJA_COMMIT: ${{ github.sha }}
          AZDAJA_RUN_ID: ${{ github.run_id }}
          AZDAJA_RUN_ATTEMPT: ${{ github.run_attempt }}
          AZDAJA_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile

          source = pathlib.Path("target/release/azdaja")
          host = subprocess.check_output(["rustc", "-vV"], text=True)
          host = next(line.split(": ", 1)[1] for line in host.splitlines() if line.startswith("host: "))
          name = f"azdaja-{os.environ['AZDAJA_COMMIT']}-{host}"
          dist = pathlib.Path("dist")
          payload = pathlib.Path("candidate-payload")
          dist.mkdir(exist_ok=False)
          payload.mkdir(exist_ok=False)
          target = payload / name
          shutil.copy2(source, target)
          shutil.copy2("LICENSE", payload / "LICENSE")
          shutil.copy2("THIRD-PARTY-NOTICES.md", payload / "THIRD-PARTY-NOTICES.md")
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          payload_names = [name, "LICENSE", "THIRD-PARTY-NOTICES.md"]
          (payload / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256((payload / payload_name).read_bytes()).hexdigest()}  {payload_name}\n"
              for payload_name in payload_names
          ))
          receipt = {
              "schema_version": 1,
              "record_type": "azdaja_unvalidated_release_candidate",
              "status": "UNVALIDATED_NOT_FOR_PUBLICATION",
              "commit": os.environ["AZDAJA_COMMIT"],
              "host": host,
              "runner_os": os.environ["AZDAJA_RUNNER_OS"],
              "github_run_id": os.environ["AZDAJA_RUN_ID"],
              "github_run_attempt": os.environ["AZDAJA_RUN_ATTEMPT"],
              "binary": {"name": name, "bytes": target.stat().st_size, "sha256": digest},
              "version": subprocess.check_output([str(target), "--version"], text=True).strip(),
              "checks": [
                  "fmt",
                  "clippy",
                  "locked-tests",
                  "locked-release-build",
                  "doctor-caps",
                  "hash-bound-loopback-http-site-install",
                  "alias-and-canonical-exact-five-line-plain-help",
                  "NO_COLOR-exact-five-line-plain-help",
                  "provider-command-guard-untouched",
                  "installed-release-binary-three-file-50MiB",
                  "custom-config-preserved-on-reinstall",
                  "managed-uninstall-cleanup",
              ],
              "publication_authorized": False,
              "limitations": [
                  "no public installer receipt",
                  "no live OAuth doctor",
                  "scripted installed-binary cases do not prove live-model planning",
              ],
          }
          (payload / "candidate-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n"
          )
          archive = dist / f"{name}.tar.gz"
          with tarfile.open(archive, "w:gz") as bundle:
              for item in sorted(payload.iterdir()):
                  bundle.add(item, arcname=item.name)
          archive_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / "ARCHIVE_SHA256").write_text(f"{archive_digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: azdaja-candidate-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  standalone-targets:
    name: standalone ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-14
            rust_target: x86_64-apple-darwin
            asset: darwin-x86_64
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: standalone-${{ matrix.rust_target }}
      - name: Build documented standalone target
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"
      - name: Verify standalone target architecture
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/azdaja"
          test -x "$binary"
          python3 - "$binary" "$RUST_TARGET" <<'PY'
          import pathlib
          import struct
          import sys

          binary = pathlib.Path(sys.argv[1]).read_bytes()
          target = sys.argv[2]
          if target == "aarch64-apple-darwin":
              assert binary[:4] == b"\xcf\xfa\xed\xfe", binary[:4]
              assert struct.unpack("<I", binary[4:8])[0] == 0x0100000C
          elif target == "x86_64-apple-darwin":
              assert binary[:4] == b"\xcf\xfa\xed\xfe", binary[:4]
              assert struct.unpack("<I", binary[4:8])[0] == 0x01000007
          elif target == "x86_64-unknown-linux-gnu":
              assert binary[:4] == b"\x7fELF", binary[:4]
              assert binary[5] == 1, "release ELF must be little-endian"
              assert struct.unpack("<H", binary[18:20])[0] == 62
          else:
              raise AssertionError(f"unreviewed standalone target: {target}")
          PY
      - name: Stage standalone release candidate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-candidate
          cp "target/${{ matrix.rust_target }}/release/azdaja" \
            "release-candidate/azdaja-v0.1.13-${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: azdaja-standalone-${{ matrix.asset }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - name: Run Windows Clippy with public diagnostics
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "azdaja-windows-clippy.log"
          cargo clippy --quiet --all-targets --all-features --locked -- -D warnings 2>&1 |
            Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $message = Get-Content -Raw $log
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows Clippy diagnostic::$message"
            exit $status
          }
      - run: cargo test --lib --bin azdaja --locked -- --test-threads=1
      - run: cargo build --release --locked
      - run: .\target\release\azdaja.exe --version
      - run: .\target\release\azdaja.exe doctor --caps
      - name: Validate Windows installer and tamper refusal
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "azdaja-windows-installer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $release = Join-Path $scratch "v0.1.13"
          $install = Join-Path $scratch "installed"
          $tamperedInstall = Join-Path $scratch "tampered-installed"
          $asset = "azdaja-v0.1.13-windows-x86_64.exe"
          try {
            New-Item -ItemType Directory -Path $release -Force | Out-Null
            Copy-Item .\target\release\azdaja.exe (Join-Path $release $asset)
            $hash = (Get-FileHash (Join-Path $release $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              (Join-Path $release "SHA256SUMS"),
              "$hash  $asset`n",
              [Text.UTF8Encoding]::new($false)
            )

            & .\site\install.ps1 -ReleaseRoot $scratch -InstallDir $install -NoPathUpdate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $install "azdaja.exe") --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            [IO.File]::AppendAllText((Join-Path $release $asset), "tamper")
            $refused = $false
            try {
              & .\site\install.ps1 `
                -ReleaseRoot $scratch `
                -InstallDir $tamperedInstall `
                -NoPathUpdate
            } catch {
              if (-not $_.Exception.Message.Contains("checksum mismatch")) { throw }
              $refused = $true
            }
            if (-not $refused) { throw "tampered Windows payload was accepted" }
            if (Test-Path (Join-Path $tamperedInstall "azdaja.exe")) {
              throw "tampered Windows install published an artifact"
            }
          } finally {
            Remove-Item $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Stage Windows release candidate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-candidate | Out-Null
          Copy-Item .\target\release\azdaja.exe `
            .\release-candidate\azdaja-v0.1.13-windows-x86_64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: azdaja-standalone-windows-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
