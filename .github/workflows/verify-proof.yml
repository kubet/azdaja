name: Verify first-party proof bundle

on:
  push:
    paths:
      - "proof/reproduction/**"
      - "bench/results/live-fable-suite.*"
      - "bench/results/product-50mb-current-source.*"
      - "bench/live_fable_suite/**"
      - "bench/product_50mb/**"
      - "tests/product_50mb.rs"
      - "tests/public_surface.rs"
      - "README.md"
      - "BENCHMARKS.md"
      - "site/index.html"
      - "site/proof.html"
      - "docs/release/notice-audit-2026-09-04.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "THIRD-PARTY-NOTICES.md"
      - "release/build-current-third-party-notice.py"
      - "release/verify-current-third-party-notice.py"
      - "release/current-third-party-notice.json"
      - "release/historical/**"
      - "release/assemble-standalone-assets.sh"
      - "release/THIRD-PARTY-NOTICE-GENERATION.md"
      - "tests/notice_distribution.rs"
      - "release/verify-third-party-notices.py"
      - "release/test_verify_third_party_notices.py"
      - "release/audit-third-party-notice-inputs.py"
      - "release/test_audit_third_party_notice_inputs.py"
      - "release/third-party-notice-inputs.json"
      - "release/reconcile-third-party-notice.py"
      - "release/test_reconcile_third_party_notice.py"
      - "release/third-party-notice-reconciliation.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/verify-proof.yml"
  pull_request:
    paths:
      - "proof/reproduction/**"
      - "bench/results/live-fable-suite.*"
      - "bench/results/product-50mb-current-source.*"
      - "bench/live_fable_suite/**"
      - "bench/product_50mb/**"
      - "tests/product_50mb.rs"
      - "tests/public_surface.rs"
      - "README.md"
      - "BENCHMARKS.md"
      - "site/index.html"
      - "site/proof.html"
      - "docs/release/notice-audit-2026-09-04.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "THIRD-PARTY-NOTICES.md"
      - "release/build-current-third-party-notice.py"
      - "release/verify-current-third-party-notice.py"
      - "release/current-third-party-notice.json"
      - "release/historical/**"
      - "release/assemble-standalone-assets.sh"
      - "release/THIRD-PARTY-NOTICE-GENERATION.md"
      - "tests/notice_distribution.rs"
      - "release/verify-third-party-notices.py"
      - "release/test_verify_third_party_notices.py"
      - "release/audit-third-party-notice-inputs.py"
      - "release/test_audit_third_party_notice_inputs.py"
      - "release/third-party-notice-inputs.json"
      - "release/reconcile-third-party-notice.py"
      - "release/test_reconcile_third_party_notice.py"
      - "release/third-party-notice-reconciliation.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/verify-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: First-party proof unit tests (Python and Git only)
        run: python3 -m unittest proof/reproduction/test_verify.py
      - name: Offline proof verification
        shell: bash
        run: |
          set -euo pipefail
          ./proof/reproduction/run.sh | tee "$RUNNER_TEMP/proof-verification.json"
      - name: Retain verifier output
        uses: actions/upload-artifact@v4
        with:
          name: first-party-proof-verification
          path: ${{ runner.temp }}/proof-verification.json
          if-no-files-found: error
          retention-days: 30

  notices:
    # Separate from the Python/Git-only first-party proof verifier.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Cache all supported-target notice inputs (including optional features)
        shell: bash
        run: |
          set -euo pipefail
          # cargo fetch covers the locked optional dependencies, not just host defaults.
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            cargo fetch --locked --target "$target"
          done
      - name: Source-backed offline notice verification and mutation tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          python3 release/verify-third-party-notices.py
          python3 -m unittest discover -s release -p 'test_*notice*.py' -v
