name: First-use feedback
description: Report a successful or unsuccessful first Azdaja product use without sharing private input.
title: "[first use] "
labels: ["first-use"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Azdaja. The v0.1.14 binary installer supports Apple Silicon and Intel macOS, plus Linux x86_64; other platforms are source-only.

        Do not paste or attach raw build logs, repository content, transcripts, traces, config files, host paths, OAuth material, tokens, or secrets. Synthetic or sanitized reproductions only.
  - type: dropdown
    id: install
    attributes:
      label: Installation path
      options:
        - v0.1.14 macOS arm64, macOS x86_64, or Linux x86_64 installer
        - Locked source installation on another platform
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Azdaja version, if available
      description: Output of `azdaja --version` only. If installation failed before a binary existed, leave this blank.
      placeholder: azdaja 0.1.2 (monty 0.0.21)
  - type: input
    id: architecture
    attributes:
      label: Operating system and architecture
      placeholder: macOS arm64 or Linux x86_64
    validations:
      required: true
  - type: dropdown
    id: workload
    attributes:
      label: Input class
      options:
        - Not reached — installation or doctor failed
        - Build log
        - Repository dump
        - Transcript
        - Other synthetic or sanitized text
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Approximate input size, if reached
      description: Enter `not reached` if installation or doctor failed before processing.
      placeholder: Approximate bytes or not reached
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Installed and completed successfully
        - Installation failed
        - Doctor failed
        - Process died or timed out
        - Completed with an incorrect answer
        - Other product defect
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Describe behavior and timing without quoting private input or traces.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic or sanitized reproduction
      description: Optional. Include only a minimal reproduction that contains no private or secret material.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed raw input, traces, config, host paths, OAuth material, tokens, and secrets from this report.
          required: true
