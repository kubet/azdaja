name: Product defect
description: Report an installation, authentication, death, timeout, or correctness defect safely.
title: "[product defect] "
body:
  - type: markdown
    attributes:
      value: |
        Product defects outrank benchmark work. Please provide a synthetic or sanitized reproduction only.

        Never post raw logs, repository content, transcripts, traces, config files, host paths, OAuth material, tokens, or secrets. For a security vulnerability, use the private Security Advisory link on the issue chooser; do not open a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Defect area
      options:
        - One-command installation or upgrade
        - Doctor or authentication
        - 50 MiB build-log processing
        - 50 MiB repository-dump processing
        - 50 MiB transcript processing
        - Config preservation or uninstall
        - Other CLI/runtime behavior
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation path
      options:
        - Published v0.1.0 Apple Silicon macOS installer
        - Locked source installation on another platform
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Azdaja version
      description: Output of `azdaja --version` only.
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include exit status and a sanitized error summary, but no private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic or sanitized reproduction
      description: Minimal steps and generated data only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed raw input, traces, config, host paths, OAuth material, tokens, and secrets from this report.
          required: true
