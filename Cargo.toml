[package]
name = "azdaja"
version = "0.1.18"
edition = "2024"
license = "MIT"
description = "Virtual memory for language models with a bounded model-facing surface"
repository = "https://github.com/kubet/azdaja"
rust-version = "1.95"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/THIRD-PARTY-NOTICES.md",
    "/README.md",
    "/src/**",
    "/assets/template/SKILL.md",
    "/assets/config.toml",
    "/assets/legacy/*.toml",
]

[features]
default = []
typesafe = ["dep:reqwest", "dep:ruff_python_ast", "dep:ruff_python_parser"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
fs2 = "0.4"
# Work around monty 0.0.21 published resolver skew; keep exact until upstream fixes it.
compact_str = "=0.9.0"
get-size2 = "=0.10.1"
libc = "0.2"
memmap2 = "0.9"
monty = "=0.0.21"
monty-types = "=0.0.21"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1.11"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
# Reuse Monty's exact, already locked parser for optional native-call preflight.
ruff_python_ast = { version = "=0.0.3", optional = true }
ruff_python_parser = { version = "=0.0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shlex = "1.3"
strip-ansi-escapes = "0.2"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
panic = "unwind"
codegen-units = 1
